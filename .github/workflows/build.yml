name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon testSideloadDebugUnitTest

      # Upload-Schlüssel für Google Play (nur wenn die Secrets gesetzt sind)
      - name: Upload-Schlüssel einrichten
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleSideloadDebug assembleSideloadRelease bundlePlayRelease

      - name: Dateien umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "out/kanso-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "out/kanso-${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "out/kanso-play-${GITHUB_RUN_NUMBER}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: kanso-apk
          path: out/*.apk

      # AAB für die Play Console (nur als Artefakt, nicht im öffentlichen Release)
      - uses: actions/upload-artifact@v4
        with:
          name: kanso-play-aab
          path: out/*.aab

      - name: GitHub-Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Kanso ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          files: out/kanso-${{ github.run_number }}.apk
          generate_release_notes: true
